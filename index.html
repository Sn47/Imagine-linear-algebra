<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Linear</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Linear: a playground for seeing linear algebra, from a single vector to SVD." />
    <style>
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f6f6f7; color: #19191c; font: 500 15px system-ui, sans-serif; letter-spacing: -0.01em; z-index: 100; transition: opacity .35s ease; }
      #splash svg path { stroke-dasharray: 16; stroke-dashoffset: 16; animation: draw .6s ease forwards; }
      #splash svg path:last-child { animation-delay: .25s; }
      #splash span { opacity: 0; animation: fade .4s ease .55s forwards; }
      #splash.done { opacity: 0; pointer-events: none; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @media (prefers-color-scheme: dark) { #splash { background: #0f0f12; color: #ececf1; } }
      @media (prefers-reduced-motion: reduce) { #splash svg path, #splash span { animation: none; stroke-dashoffset: 0; opacity: 1; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="40" height="40" fill="none" stroke-linecap="round" stroke-width="3"><path d="M8 24h16" stroke="#2f63d6"/><path d="M8 24V8" stroke="#d9643a"/></svg>
      <span>Linear</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
